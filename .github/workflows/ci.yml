name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy, rustfmt
    - run: cargo fmt --check
    - run: cargo clippy -- -D warnings
    - run: cargo test
